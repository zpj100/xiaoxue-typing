plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiaoxue.typing'
    compileSdk 34
    defaultConfig {
        applicationId "com.xiaoxue.typing"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
    }
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main {
            assets.srcDirs = [file("$rootDir/../dist")]
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
